name: Build
run-name: Build ${{ github.sha }}
# Every merge to main builds the packages it changed, once, and bumps dev to the new images through
# a self-merging pull request in micahg/talos-cluster (deploy-dev.yaml). Images are tagged
# sha-<first 7 of the commit>. A release later re-tags these images with semver and promotes them to
# prod; nothing is rebuilt then. Chart-only merges build nothing (Argo CD already follows main).
# If merges arrive faster than builds finish, GitHub skips the ones in the middle and the last run
# builds everything that changed since the last finished build, so no change is lost.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Package to build from the selected ref (api, mui or both)
        required: true
        type: choice
        options: [both, api, mui]
        default: both
concurrency:
  group: build-main
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.diff.outputs.api }}
      mui: ${{ steps.diff.outputs.mui }}
      tag: ${{ steps.diff.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=false mui=false
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$WANT" != mui ] && api=true
            [ "$WANT" != api ] && mui=true
          else
            # Merges that arrive while another build is running can be skipped (GitHub keeps one
            # pending run per group). So compare against the last commit a push run of this workflow
            # finished for, not against HEAD^, otherwise a skipped merge's changes would never build.
            BASE=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yaml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
            if [ -z "$BASE" ] || ! git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
              echo "No usable earlier build to compare with, building both."
              api=true mui=true
            else
              echo "Comparing with the last finished build, ${BASE:0:7}"
              files=$(git diff --name-only "$BASE" HEAD)
              echo "$files"
              # packages/common feeds both; the lockfiles are shared
              echo "$files" | grep -qE '^(packages/api/|packages/common/|package(-lock)?\.json$)' && api=true
              echo "$files" | grep -qE '^(packages/mui/|packages/common/|package(-lock)?\.json$)' && mui=true
            fi
          fi
          {
            echo "api=$api"
            echo "mui=$mui"
            echo "tag=sha-${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "Build: api=$api mui=$mui tag=sha-${GITHUB_SHA:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
  package-api:
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      packages: write
    with:
      package: api
      tag: ${{ needs.changes.outputs.tag }}
  package-mui:
    needs: [changes]
    if: needs.changes.outputs.mui == 'true'
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      packages: write
    with:
      package: mui
      tag: ${{ needs.changes.outputs.tag }}
  dev:
    needs: [changes, package-api, package-mui]
    # a skipped package job must not skip dev, a failed one must
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.mui == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-dev.yaml
    secrets: inherit
    with:
      api-version: ${{ needs.changes.outputs.api == 'true' && needs.changes.outputs.tag || '' }}
      mui-version: ${{ needs.changes.outputs.mui == 'true' && needs.changes.outputs.tag || '' }}
  # Cloudflare Worker (migration in progress): runs beside the image build and deploy, and nothing
  # waits on it, so a failure here cannot block the k8s dev deploy.
  worker-dev:
    needs: [changes]
    if: needs.changes.outputs.mui == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-worker.yaml
    secrets: inherit
    with:
      environment: dev
