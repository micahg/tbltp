name: Build Check
# Builds the images (no push) when a pull request touches a Dockerfile or the UI's nginx config,
# so a broken base image bump fails the PR and not the first merge to main.
on:
  pull_request:
    paths:
      - 'packages/api/Dockerfile'
      - 'packages/mui/Dockerfile'
      - 'packages/mui/k8s/**'
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.diff.outputs.api }}
      mui: ${{ steps.diff.outputs.mui }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          echo "$files" | grep -q '^packages/api/Dockerfile$' && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^packages/mui/(Dockerfile|k8s/)' && echo "mui=true" >> "$GITHUB_OUTPUT" || echo "mui=false" >> "$GITHUB_OUTPUT"
  check-api:
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      packages: read
    with:
      package: api
      tag: pr-check
      push: false
  check-mui:
    needs: [changes]
    if: needs.changes.outputs.mui == 'true'
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      packages: read
    with:
      package: mui
      tag: pr-check
      push: false
