name: Deploy Prod
run-name: Deploy prod (api ${{ inputs.api-version || 'unchanged' }}, chart ${{ inputs.ref || 'unchanged' }})
# Prod runs on the Talos cluster and is deployed by Argo CD. CI never touches the cluster: after
# the Prod environment's reviewers approve, it bumps the image versions in envs/prod/ntt.yaml of
# the micahg/talos-cluster repo (and, for a release tag, the chart revision in
# argocd/prod/apps/ntt.yaml) through a PR that merges itself. Argo CD then deploys it (about 3
# minutes). The approval on the Prod environment is the only gate. Needs the repository secret
# TALOS_CLUSTER_TOKEN (write access to contents and pull requests on talos-cluster only).
on:
  workflow_call:
    inputs:
      api-version:
        required: false
        type: string
        default: ""
      release-version:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      api-version:
        description: API image version, e.g. 0.44.0 (blank leaves it unchanged)
        required: false
        type: string
      release-version:
        description: Release version shown by the app, e.g. 0.63.0 (blank leaves it unchanged)
        required: false
        type: string
      ref:
        description: Chart revision (a v* tag, or main). Blank leaves the current one. The revision must have prod as the chart default (values.yaml), which older tags do not.
        required: false
        type: string
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    # Settings -> Environments -> Prod -> Required reviewers: the job waits here for approval.
    environment: Prod
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.TALOS_CLUSTER_TOKEN }}
      API_VERSION: ${{ inputs.api-version }}
      RELEASE_VERSION: ${{ inputs.release-version }}
      CHART_REF: ${{ inputs.ref }}
    steps:
      - name: Check Token
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secret TALOS_CLUSTER_TOKEN is not set"; exit 1; }
      # the chart that gets validated (and that Argo will render) is the one at the requested revision
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/checkout@v7
        with:
          repository: micahg/talos-cluster
          ref: main
          path: cluster
          token: ${{ secrets.TALOS_CLUSTER_TOKEN }}
      - name: Update Prod Versions
        working-directory: cluster
        run: |
          set -euo pipefail
          f=envs/prod/ntt.yaml
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          set_value() {
            local key=$1 val=$2
            [ -z "$val" ] && return 0
            if ! [[ "$val" =~ $semver ]]; then
              echo "::error::$key '$val' is not x.y.z"
              exit 1
            fi
            sed -i -E "s/^${key}: .*/${key}: \"${val}\"/" "$f"
            grep -q "^${key}: \"${val}\"$" "$f" || { echo "::error::could not set $key"; exit 1; }
          }
          RELEASE_VERSION=${RELEASE_VERSION#v}
          if [ -n "$RELEASE_VERSION" ] && ! [[ "$RELEASE_VERSION" =~ $semver ]]; then
            echo "::warning::release version '$RELEASE_VERSION' is not x.y.z, leaving it unchanged"
            RELEASE_VERSION=
          fi
          set_value apiImageVers "$API_VERSION"
          set_value releaseVersion "$RELEASE_VERSION"
          # the first source of the Argo app is the tbltp chart (the second is talos-cluster itself)
          if [ -n "$CHART_REF" ]; then
            CHART_REF="$CHART_REF" yq -i '.spec.sources[0].targetRevision = strenv(CHART_REF)' argocd/prod/apps/ntt.yaml
          fi
          git diff -- "$f" argocd/prod/apps/ntt.yaml
      - name: Validate Chart
        run: helm template ntt-infra chart -f chart/values.yaml -f cluster/envs/prod/ntt.yaml > /dev/null
      - name: Open PR And Merge
        working-directory: cluster
        run: |
          set -euo pipefail
          if git diff --quiet -- envs/prod/ntt.yaml argocd/prod/apps/ntt.yaml; then
            echo "Prod is already at these versions, nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # anything still open from an earlier run is superseded by this one
          for n in $(gh pr list -R micahg/talos-cluster --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("deploy/ntt-prod-")) | .number'); do
            gh pr close "$n" -R micahg/talos-cluster --delete-branch --comment "Superseded by run $GITHUB_RUN_ID."
          done
          BRANCH="deploy/ntt-prod-${GITHUB_RUN_ID}"
          TITLE="chore: deploy ntt to prod (api ${API_VERSION:-unchanged}, chart ${CHART_REF:-unchanged})"
          git checkout -b "$BRANCH"
          git add envs/prod/ntt.yaml argocd/prod/apps/ntt.yaml
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          gh pr create -R micahg/talos-cluster --base main --head "$BRANCH" --title "$TITLE" \
            --body "Automated bump from run $GITHUB_RUN_ID, approved on the Prod environment. Argo CD deploys it to prod after the merge."
          for i in 1 2 3; do
            if gh pr merge "$BRANCH" -R micahg/talos-cluster --squash; then
              echo "Merged $BRANCH. Argo CD will deploy it to prod shortly." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh pr update-branch "$BRANCH" -R micahg/talos-cluster || true
            sleep 15
          done
          echo "::error::could not merge $BRANCH"
          exit 1
