name: Test
on:
  push:
    paths:
      - 'chart/**'
    branches-ignore:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Helm Template (default values, which are prod)
        # the pins live in micahg/talos-cluster envs/prod/ntt.yaml; --set stands in for them here
        run: |
          helm template ntt-infra chart -f chart/values.yaml \
          --set apiImageVers=CI_VALUE --set releaseVersion=CI_VALUE > /dev/null
      - name: Helm Template (dev)
        # the pins live in micahg/talos-cluster envs/dev/ntt.yaml; --set stands in for them here
        run: |
          helm template ntt-infra chart -f chart/values.yaml -f chart/values-dev.yaml \
          --set apiImageVers=CI_VALUE --set releaseVersion=CI_VALUE > /dev/null
