name: Test
on:
  push:
    paths:
      - 'chart/**'
    branches-ignore:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Helm Template (default values)
        # note that --set mongoConnectionString is a hack just to validate output
        run: |
          helm template ntt-infra chart -f chart/values.yaml \
          --set mongoConnectionString=CON_STR_VALUE \
          --set apiImageVers=CI_VALUE --set uiImageVers=CI_VALUE --set releaseVersion=CI_VALUE > /dev/null
      - name: Helm Template (Talos dev)
        run: helm template ntt-infra chart -f chart/values.yaml -f chart/values-talos-dev.yaml > /dev/null
      - name: Helm Template (Talos prod)
        run: helm template ntt-infra chart -f chart/values.yaml -f chart/values-talos-prod.yaml > /dev/null
