name: Deploy Worker
run-name: Deploy UI worker (${{ inputs.environment }}, ${{ inputs.version }})
# Cloudflare Worker deploy of a published @micahg/tbltp-mui package (publish-ui.yaml, release.yaml):
# the package carries the build, the Worker script and wrangler.jsonc, so nothing is rebuilt here and
# dev and prod serve byte-identical files. Runs next to the nginx
# image pipeline, which stays the way production is served until cutover; the two are independent,
# so a failure here never blocks the k8s deploy. The `dev` and `prod` environments have no routes
# yet, so they only publish to workers.dev; `preview` is routed to prod.tbltp.dev. Needs the
# repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Zone: Workers Routes: Edit
# and DNS: Edit on the tbltp.dev zone for custom-domain routes) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: wrangler environment to deploy
        required: true
        type: choice
        options: [preview, dev, prod]
        default: preview
      version:
        description: Published package version, e.g. 0.31.0 or 0.30.0-sha-1a2b3c4
        required: true
        type: string
concurrency:
  group: deploy-worker-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # prod waits for the same Prod environment approval as the k8s deploy
    environment: ${{ inputs.environment == 'prod' && 'Prod' || '' }}
    permissions:
      contents: read
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check Secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set"
            exit 1
          }
      # the checkout only supplies the locked wrangler binary
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci -w packages/mui
      - name: Fetch UI package
        uses: ./.github/actions/fetch-ui
        with:
          version: ${{ inputs.version }}
          token: ${{ github.token }}
          dest: ${{ runner.temp }}/ui
      - name: Deploy
        run: npx wrangler deploy --config "$RUNNER_TEMP/ui/wrangler.jsonc" --env "${{ inputs.environment }}"
