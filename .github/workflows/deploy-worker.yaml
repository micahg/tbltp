name: Deploy Worker
run-name: Deploy UI worker (${{ inputs.environment }}, ${{ inputs.version }})
# Cloudflare Worker deploy of a published @micahg/tbltp-mui package (publish-ui.yaml, release.yaml):
# the package carries the build, the Worker script and wrangler.jsonc, so nothing is rebuilt here and
# dev and prod serve byte-identical files. This is how the UI is served (dev.tbltp.dev, tbltp.dev).
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Workers Routes: Edit
# on the tbltp.dev zone) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: wrangler environment to deploy
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      version:
        description: Published package version, e.g. 0.31.0 or 0.30.0-sha-1a2b3c4
        required: true
        type: string
concurrency:
  group: deploy-worker-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # prod waits for the same Prod environment approval as the k8s deploy
    environment: ${{ inputs.environment == 'prod' && 'Prod' || '' }}
    permissions:
      contents: read
      packages: read
    env:
      WRANGLER_VERSION: 4.166.0 # wrangler is not a project dependency; bump here (and in test-mui.yaml)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check Secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set"
            exit 1
          }
      # the checkout only supplies the local fetch-ui action
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Fetch UI package
        uses: ./.github/actions/fetch-ui
        with:
          version: ${{ inputs.version }}
          token: ${{ github.token }}
          dest: ${{ runner.temp }}/ui
      # the package is already built, so no install: just run the pinned wrangler
      - name: Deploy
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config "$RUNNER_TEMP/ui/wrangler.jsonc" --env "${{ inputs.environment }}"
