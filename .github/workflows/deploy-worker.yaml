name: Deploy Worker
run-name: Deploy UI worker (${{ inputs.environment }}, ${{ inputs.ref || github.sha }})
# Cloudflare Worker deploy of packages/mui (see packages/mui/wrangler.jsonc). Runs next to the nginx
# image pipeline, which stays the way production is served until cutover; the two are independent,
# so a failure here never blocks the k8s deploy. The `dev` and `prod` environments have no routes
# yet, so they only publish to workers.dev; `preview` is routed to prod.tbltp.dev. Needs the
# repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Zone: Workers Routes: Edit
# and DNS: Edit on the tbltp.dev zone for custom-domain routes) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      environment:
        description: wrangler environment to deploy
        required: true
        type: choice
        options: [preview, dev, prod]
        default: preview
      ref:
        description: Git ref to build (defaults to the selected branch)
        required: false
        type: string
concurrency:
  group: deploy-worker-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # prod waits for the same Prod environment approval as the k8s deploy
    environment: ${{ inputs.environment == 'prod' && 'Prod' || '' }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check Secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set"
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci -w packages/mui
      - name: Build
        env:
          DISABLE_ESLINT_PLUGIN: true
        run: npm run build -w packages/mui
      - name: Deploy
        working-directory: packages/mui
        run: npx wrangler deploy --env "${{ inputs.environment }}"
