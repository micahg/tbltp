name: Test MUI
on:
  push:
    paths:
      - 'packages/mui/**'
      - 'packages/common/**'
      - 'package.json'
      - 'package-lock.json'
    branches-ignore:
      - main
jobs:
  test_mui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Node Modules
        run: npm ci
      - name: Lint Code
        run: npm -w packages/mui run lint
      - name: Unit Test
        run: npm test -w packages/mui
      - name: Test Build
        env:
          DISABLE_ESLINT_PLUGIN: true
        run: npm run build -w packages/mui
      - name: Check Worker Bundle
        working-directory: packages/mui
        env:
          WRANGLER_VERSION: 4.166.0 # wrangler is not a project dependency; bump here (and in deploy-worker.yaml)
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --env dev
