name: Release
# A release never builds (the UI package is republished, not rebuilt). Every merge to main already built the changed images as sha-<commit>
# (build.yaml). Here each changed package's image for its last commit is re-tagged with the next
# semver (same digest, so prod runs exactly what dev ran), both packages also get a
# release-<version> tag that ties them to this release, and Deploy promotes the result to dev and
# (after approval) prod.
on:
  release:
    types: [published]
jobs:
  start-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_mui: ${{ steps.version-mono.outputs.package_mui }}
      package_api: ${{ steps.version-mono.outputs.package_api }}
      new_api_version: ${{ steps.version-mono.outputs.new_api_version }}
      new_mui_version: ${{ steps.version-mono.outputs.new_mui_version }}
      current_api: ${{ steps.version-mono.outputs.current_api }}
      current_mui: ${{ steps.version-mono.outputs.current_mui }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: version-mono
        name: Gather Version Information
        run: |
          for p in api mui; do
            CHANGED=true
            NEW=
            CURRENT=
            LATEST=$(git tag -l "$p/v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST" ]; then
              echo "::error::no $p/v* tag found, seed a baseline tag first"
              exit 1
            fi
            CURRENT=${LATEST##*/}
            CURRENT=${CURRENT#v}
            BASE=$(git rev-list -n 1 "$LATEST")
            if [ "$BASE" = "$(git rev-parse HEAD)" ]; then
              CHANGED=false
            elif [ -z "$(git diff --name-only "$BASE" HEAD -- "packages/$p" packages/common)" ]; then
              CHANGED=false
            else
              NEW=$(printf '%s' "$CURRENT" | awk -F. '{printf "%d.%d.0", $1, $2+1}')
            fi
            echo "current_$p=$CURRENT" >> "$GITHUB_OUTPUT"
            if [ "$CHANGED" = true ]; then
              echo "package_$p=true" >> "$GITHUB_OUTPUT"
              echo "new_${p}_version=$NEW" >> "$GITHUB_OUTPUT"
            else
              echo "package_$p=false" >> "$GITHUB_OUTPUT"
            fi
          done
  promote:
    needs: [start-release]
    runs-on: ubuntu-latest
    outputs:
      mui_sha: ${{ steps.retag.outputs.mui_sha }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag Images
        id: retag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          PACKAGE_API: ${{ needs.start-release.outputs.package_api }}
          PACKAGE_MUI: ${{ needs.start-release.outputs.package_mui }}
          NEW_API: ${{ needs.start-release.outputs.new_api_version }}
          NEW_MUI: ${{ needs.start-release.outputs.new_mui_version }}
          CURRENT_API: ${{ needs.start-release.outputs.current_api }}
          CURRENT_MUI: ${{ needs.start-release.outputs.current_mui }}
        run: |
          set -euo pipefail
          REL="release-${RELEASE_TAG#v}"
          for p in api mui; do
            up=${p^^}
            changed=PACKAGE_$up; new=NEW_$up; current=CURRENT_$up
            IMG="ghcr.io/${REPO}-$p"
            if [ "${!changed}" = true ]; then
              # Merges can be skipped by the build, so the image for the last commit that touched
              # this package may not exist. Use the newest commit whose image exists and whose
              # package content equals the release's (build.yaml builds everything since its last run).
              SRC=
              for i in $(seq 1 30); do
                for c in $(git rev-list --first-parent -n 200 HEAD); do
                  git diff --quiet "$c" HEAD -- "packages/$p" packages/common || break
                  if docker buildx imagetools inspect "$IMG:sha-${c:0:7}" > /dev/null 2>&1; then SRC="$IMG:sha-${c:0:7}"; break; fi
                done
                [ -n "$SRC" ] && break
                echo "no $p image for this release's content yet, waiting ($i/30)"; sleep 20
              done
              [ -n "$SRC" ] || {
                echo "::error::no sha-<commit> image of $p matches this release. Its build failed or never ran; run Build (workflow_dispatch) for $p on the release commit, then re-run this job."
                exit 1
              }
              docker buildx imagetools create -t "$IMG:${!new}" -t "$IMG:$REL" "$SRC"
              # the UI package for this commit was published with the same sha suffix
              [ "$p" = mui ] && echo "mui_sha=${SRC##*:sha-}" >> "$GITHUB_OUTPUT"
              echo "$p: ${SRC##*:} -> ${!new} ($REL)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              # unchanged since its last release: it ships the image it already had
              docker buildx imagetools create -t "$IMG:$REL" "$IMG:${!current}"
              echo "$p: unchanged, ${!current} ($REL)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
  # The mui image was assembled from @micahg/tbltp-mui@<base>-sha.<commit> (publish-ui.yaml). Publish
  # those same files under the release version, so prod, the Worker, and anyone installing the
  # package get the exact build dev ran, and attach the tarball to the release for anonymous download.
  publish-ui:
    needs: [start-release, promote]
    if: needs.start-release.outputs.package_mui == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://npm.pkg.github.com
          scope: '@micahg'
      - name: Republish UI Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          NEW: ${{ needs.start-release.outputs.new_mui_version }}
          SHA: ${{ needs.promote.outputs.mui_sha }}
        run: |
          set -euo pipefail
          PKG=@micahg/tbltp-mui
          SRC=$(npm view "$PKG" versions --json | jq -r --arg s "-sha.$SHA" 'if type == "array" then .[] else . end | select(endswith($s))' | head -n 1)
          [ -n "$SRC" ] || { echo "::error::no $PKG version ending -sha.$SHA, the Build run for that commit did not publish it"; exit 1; }
          d=$(mktemp -d)
          npm pack "$PKG@$SRC" --pack-destination "$d" > /dev/null
          mkdir "$d/pkg" "$d/out"
          tar -xzf "$d"/*.tgz -C "$d/pkg" --strip-components=1
          cd "$d/pkg"
          npm pkg set version="$NEW"
          if [ -z "$(npm view "$PKG@$NEW" version 2> /dev/null || true)" ]; then
            npm publish
          else
            echo "$PKG@$NEW is already published"
          fi
          npm pack --pack-destination "$d/out" > /dev/null
          gh release upload "$RELEASE_TAG" "$d"/out/*.tgz --clobber
          echo "ui: $SRC -> $NEW (same files)" | tee -a "$GITHUB_STEP_SUMMARY"
  tag-packages:
    needs: [start-release, promote, publish-ui]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Tag Released Packages
        env:
          API_VERSION: ${{ needs.start-release.outputs.new_api_version }}
          MUI_VERSION: ${{ needs.start-release.outputs.new_mui_version }}
        run: |
          if [ "${{ needs.start-release.outputs.package_api }}" = true ]; then
            git tag "api/v$API_VERSION" && git push origin "api/v$API_VERSION"
          fi
          if [ "${{ needs.start-release.outputs.package_mui }}" = true ]; then
            git tag "mui/v$MUI_VERSION" && git push origin "mui/v$MUI_VERSION"
          fi
  trigger-deployment:
    needs: [tag-packages]
    # a skipped package job (nothing changed for it) would otherwise skip this too
    if: always() && needs.tag-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yaml
