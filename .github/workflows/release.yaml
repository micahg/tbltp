name: Release
on:
  release:
    types: [published]
jobs:
  start-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_mui: ${{ steps.version-mono.outputs.package_mui }}
      package_api: ${{ steps.version-mono.outputs.package_api }}
      new_api_version: ${{ steps.version-mono.outputs.new_api_version }}
      new_mui_version: ${{ steps.version-mono.outputs.new_mui_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: version-mono
        name: Gather Version Information
        run: |
          for p in api mui; do
            CHANGED=true
            NEW=
            LATEST=$(git tag -l "$p/v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST" ]; then
              echo "::error::no $p/v* tag found, seed a baseline tag first"
              exit 1
            fi
            BASE=$(git rev-list -n 1 "$LATEST")
            if [ "$BASE" = "$(git rev-parse HEAD)" ]; then
              CHANGED=false
            elif [ -z "$(git diff --name-only "$BASE" HEAD -- "packages/$p" packages/common)" ]; then
              CHANGED=false
            else
              CURRENT=${LATEST##*/}
              NEW=$(printf '%s' "${CURRENT#v}" | awk -F. '{printf "%d.%d.0", $1, $2+1}')
            fi
            if [ "$CHANGED" = true ]; then
              echo "package_$p=true" >> "$GITHUB_OUTPUT"
              echo "new_${p}_version=$NEW" >> "$GITHUB_OUTPUT"
            else
              echo "package_$p=false" >> "$GITHUB_OUTPUT"
            fi
          done
  package-mui:
    needs: [start-release]
    if: needs.start-release.outputs.package_mui == 'true'
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      packages: write
    with:
      package: mui
      registry: ghcr.io
      version: ${{ needs.start-release.outputs.new_mui_version }}
  package-api:
    needs: [start-release]
    if: needs.start-release.outputs.package_api == 'true'
    uses: ./.github/workflows/docker.yaml
    permissions:
      contents: read
      packages: write
    with:
      package: api
      registry: ghcr.io
      version: ${{ needs.start-release.outputs.new_api_version }}
  tag-packages:
    needs: [start-release, package-api, package-mui]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Tag Released Packages
        env:
          API_VERSION: ${{ needs.start-release.outputs.new_api_version }}
          MUI_VERSION: ${{ needs.start-release.outputs.new_mui_version }}
        run: |
          if [ "${{ needs.start-release.outputs.package_api }}" = true ]; then
            git tag "api/v$API_VERSION" && git push origin "api/v$API_VERSION"
          fi
          if [ "${{ needs.start-release.outputs.package_mui }}" = true ]; then
            git tag "mui/v$MUI_VERSION" && git push origin "mui/v$MUI_VERSION"
          fi
  trigger-deployment:
    needs: [tag-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yaml
