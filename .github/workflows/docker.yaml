name: Build Docker Image
run-name: Build ${{ inputs.package }} image (${{ inputs.tag }}, push ${{ inputs.push }})
# Reusable. Builds packages/<package> and, when push is true, pushes ghcr.io/<repo>-<package>:<tag>.
# Images are built once, on merge to main (build.yaml), and tagged sha-<commit>. A release never
# rebuilds: it re-tags that image (release.yaml). Pull requests that touch a Dockerfile only build
# (push false) so a broken Dockerfile is caught before the merge.
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      registry:
        required: false
        type: string
        default: ghcr.io
      tag:
        description: Image tag, e.g. sha-1a2b3c4
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: true
      ui-version:
        description: Published @micahg/tbltp-mui version to assemble the mui image from (blank builds from source)
        required: false
        type: string
        default: ""
jobs:
  docker-image:
    runs-on: ubuntu-latest
    # permissions come from the caller: packages write to push (build.yaml), read to only build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # the mui image is assembled from the published package, so it holds exactly the files the
      # Worker deploys. Without a version (a pull request touching the Dockerfile) it builds from source.
      - if: inputs.package != 'mui' || inputs.ui-version == ''
        run: npm ci -w packages/${{ inputs.package }}
      - name: Package build
        if: inputs.package != 'mui' || inputs.ui-version == ''
        env:
          DISABLE_ESLINT_PLUGIN: true
        run: npm run build -w packages/${{ inputs.package }}
      - name: Fetch UI package
        if: inputs.package == 'mui' && inputs.ui-version != ''
        uses: ./.github/actions/fetch-ui
        with:
          version: ${{ inputs.ui-version }}
          token: ${{ github.token }}
          dest: ${{ runner.temp }}/ui
      - name: Use UI package build
        if: inputs.package == 'mui' && inputs.ui-version != ''
        run: cp -r "$RUNNER_TEMP/ui/build" packages/mui/build
      - uses: docker/setup-buildx-action@v4
      - name: Docker registry login
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: ./packages/${{ inputs.package }}/
          file: ./packages/${{ inputs.package }}/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ inputs.registry }}/${{ github.repository }}-${{ inputs.package }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ github.repository }}-${{ inputs.package }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.package }}
          cache-to: type=gha,mode=max,scope=${{ inputs.package }}
