version: 2
updates:
  - package-ecosystem: docker
    directory: /packages/api
    schedule:
      interval: weekly
    ignore:
      # stay on the current Node LTS line; bump majors by hand
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /packages/mui
    schedule:
      interval: weekly
    ignore:
      # nginx publishes odd (mainline) minors too; stay on the stable (even) branch by hand
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
