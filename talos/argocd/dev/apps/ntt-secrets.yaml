# SealedSecrets for the app (encrypted; safe to commit). Also creates the ntt namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntt-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/micahg/tbltp.git
    targetRevision: feat/talos   # switch to main once merged
    path: talos/apps/ntt/secrets/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ntt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
