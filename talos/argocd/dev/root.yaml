# App of apps: Argo CD watches talos/argocd/dev/apps and creates one Application per file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/micahg/tbltp.git
    targetRevision: feat/talos   # switch to main once merged
    path: talos/argocd/dev/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
