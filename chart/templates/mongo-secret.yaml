{{- if .Values.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mongoName }}-connection-string
  namespace: {{ .Values.namespace }}
stringData:
  # mongoConnectionString will be set by the github action
  mongo.url: {{ required "mongoConnectionString is required when createSecrets is true" .Values.mongoConnectionString }}
immutable: false
{{- end }}
