# image tags, releaseVersion and deployEnv are set at install time (CI deploys pass --set)
namespace: ntt
deployEnv: local
uiAppName: ntt-ui
uiAppReplicas: 1
uiImagePath: ghcr.io/micahg/tbltp-mui
uiDomain: "tbltp.dev"
apiAppName: ntt-api
apiAppReplicas: 1
apiImagePath: ghcr.io/micahg/tbltp-api
apiDomain: "api.tbltp.dev"
mongoName: "mongo"
mongoSuffix: "lrmrxki.mongodb.net"
mongoImagePath: mongo
mongoImageVers: 8.0.4
mongoPort: 27017
mongoDB: tbltp
certIssuer: letsencrypt-staging
maxBodySize: 32m
wsReadTimeout: 60
wsSendTimeout: 60
ingressNamespace: "ingress-nginx"
issuerDomain: "tbltp.us.auth0.com"
clientId: I9UCeStWDPIHZsXhXk9XeIDpFyIjBwC8
otelDomain: "otlp-gateway-prod-ca-east-0.grafana.net"
otelPort: 443
lokiHost: "logs-prod-018.grafana.net"
# Telemetry credentials (set via CI/CD values; absent values disable telemetry)
otelHeaders: ""
lokiUserId: ""
lokiToken: ""
# S3 storage configuration (set via CI/CD values)
storageS3Endpoint: ""
storageS3Bucket: ""
storageS3AccessKeyId: ""
storageS3SecretAccessKey: ""
# Feature switches (defaults keep the original behaviour)
ingressEnabled: true     # false when traffic arrives through Cloudflare Tunnel
createNamespace: true    # false when another Argo CD app creates the namespace
createSecrets: true      # false when Secrets are supplied out of band (Sealed Secrets)
mongoExternal: false     # true when MONGO_URL comes from a pre-created Secret (e.g. Atlas)
