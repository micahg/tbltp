# Prod on the Talos cluster, deployed by Argo CD.
# releaseVersion, apiImageVers and uiImageVers are NOT here: they live in
# micahg/talos-cluster envs/prod/ntt.yaml, bumped by a pull request there after you approve a
# release. For a local render pass them with --set.
deployEnv: prod

# The production hostnames, served through the prod Cloudflare tunnel.
uiDomain: "tbltp.dev"
apiDomain: "api.tbltp.dev"
issuerDomain: "tbltp.us.auth0.com"
clientId: I9UCeStWDPIHZsXhXk9XeIDpFyIjBwC8

# Traffic arrives via cloudflared, not nginx. The Cilium policies admit it by namespace.
ingressEnabled: false
ingressNamespace: cloudflared

# Secrets (mongo-connection-string, ntt-api-s3-storage) come from SealedSecrets,
# applied by the ntt-secrets Argo CD app. MONGO_URL points at Atlas and must name the database
# (mongoDB: tbltp), otherwise the API would use "test".
createNamespace: false
createSecrets: false
mongoExternal: true

# Cloudflare R2 (bucket host is two labels deep, hence **). Keeps the account id out of Git.
storageS3EgressPatterns:
  - "**.r2.cloudflarestorage.com"
